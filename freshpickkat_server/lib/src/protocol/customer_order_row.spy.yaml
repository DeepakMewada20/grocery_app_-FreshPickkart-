class: CustomerOrderRow
serverOnly: true
table: customer_order
fields:
  id: UuidValue?, defaultPersist=random
  userId: UuidValue, relation(parent=app_user, onDelete=Restrict)
  orderNumber: String
  orderStatus: String
  paymentStatus: String
  refundStatus: String
  couponId: UuidValue?, relation(parent=coupon, onDelete=Restrict)
  itemCount: int
  totalAmount: double
  discountAmount: double, default=0
  deliveryFee: double, default=0
  finalAmount: double
  placedAt: DateTime?
  confirmedAt: DateTime?
  packedAt: DateTime?
  outForDeliveryAt: DateTime?
  deliveredAt: DateTime?
  cancelledAt: DateTime?
  cancellationReason: String?
  deliveryPersonName: String?
  deliveryPersonPhone: String?
  deliveryOtp: String?
  analyticsProcessedAt: DateTime?
  orderedAt: DateTime, defaultModel=now, defaultPersist=now
  createdAt: DateTime, defaultModel=now, defaultPersist=now
  updatedAt: DateTime, defaultModel=now, defaultPersist=now
indexes:
  customer_order_order_number_idx:
    fields: orderNumber
    unique: true
  customer_order_user_ordered_idx:
    fields: userId, orderedAt, id
  customer_order_status_ordered_idx:
    fields: orderStatus, orderedAt, id
  customer_order_payment_ordered_idx:
    fields: paymentStatus, orderedAt, id
  customer_order_user_payment_ordered_idx:
    fields: userId, paymentStatus, orderedAt, id
