class: SupportIssueRow
serverOnly: true
table: support_issue
fields:
  id: UuidValue?, defaultPersist=random
  userId: UuidValue, relation(parent=app_user, onDelete=Restrict)
  issueType: String
  title: String
  description: String
  screenshotUrl: String?
  appVersion: String
  buildNumber: String
  deviceInfo: String
  status: String, default='Pending'
  createdAt: DateTime, defaultModel=now, defaultPersist=now
  updatedAt: DateTime, defaultModel=now, defaultPersist=now
indexes:
  support_issue_user_created_idx:
    fields: userId, createdAt
  support_issue_status_created_idx:
    fields: status, createdAt
