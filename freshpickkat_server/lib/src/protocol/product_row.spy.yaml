class: ProductRow
serverOnly: true
table: product
fields:
  id: UuidValue?, defaultPersist=random
  categoryId: UuidValue, relation(parent=category, onDelete=Restrict)
  name: String
  slug: String
  shortDescription: String?
  description: String?
  primaryImageUrl: String?
  countryOfOrigin: String?
  baseUnit: String?
  baseQuantity: double?
  quantityDescription: String?
  stock: double?
  stockUnit: String?
  discountType: String?
  isFreeDelivery: bool, default=false
  mostSearchCount: int, default=0
  mostPurchaseCount: int, default=0
  last7DaysSold: int, default=0
  last7DaysViews: int, default=0
  reorderCount: int, default=0
  trendingScore: double, default=0
  status: String, default='active'
  deactivatedAt: DateTime?
  createdAt: DateTime, defaultModel=now, defaultPersist=now
  updatedAt: DateTime, defaultModel=now, defaultPersist=now
indexes:
  product_slug_idx:
    fields: slug
    unique: true
  product_trending_score_idx:
    fields: trendingScore, id
  product_most_purchase_count_idx:
    fields: mostPurchaseCount, id
  product_most_search_count_idx:
    fields: mostSearchCount, id
  product_reorder_count_idx:
    fields: reorderCount, id
