class: ComboOfferItemRow
serverOnly: true
table: combo_offer_item
fields:
  id: UuidValue?, defaultPersist=random
  comboOfferId: UuidValue, relation(parent=combo_offer, onDelete=Cascade)
  productId: UuidValue
  productVariantId: UuidValue?
  quantity: int
  sortOrder: int, default=0
  createdAt: DateTime, defaultModel=now, defaultPersist=now
indexes:
  combo_offer_item_unique_idx:
    fields: comboOfferId, productId, productVariantId
    unique: true
