class: BogoOfferRow
serverOnly: true
table: bogo_offer
fields:
  id: UuidValue?, defaultPersist=random
  triggerProductId: UuidValue
  triggerVariantId: UuidValue?
  minTriggerQuantity: int, default=1
  triggerBaseQuantity: double?
  triggerBaseUnit: String?
  title: String
  startsAt: DateTime
  endsAt: DateTime
  status: String, default='active'
  deactivatedAt: DateTime?
  createdAt: DateTime, defaultModel=now, defaultPersist=now
  updatedAt: DateTime, defaultModel=now, defaultPersist=now
