class: CategoryOfferProductExclusionRow
serverOnly: true
table: category_offer_product_exclusion
fields:
  id: UuidValue?, defaultPersist=random
  categoryOfferId: UuidValue, relation(parent=category_offer, onDelete=Cascade)
  productId: UuidValue, relation(parent=product, onDelete=Restrict)
  createdAt: DateTime, defaultModel=now, defaultPersist=now
indexes:
  category_offer_product_exclusion_unique_idx:
    fields: categoryOfferId, productId
    unique: true
