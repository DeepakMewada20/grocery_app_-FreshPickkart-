class: OrderItemRow
serverOnly: true
table: order_item
fields:
  id: UuidValue?, defaultPersist=random
  orderId: UuidValue, relation(parent=customer_order, onDelete=Cascade)
  productId: UuidValue
  productVariantId: UuidValue?
  comboOfferId: UuidValue?
  bogoOfferId: UuidValue?
  triggerProductId: UuidValue?
  productNameSnapshot: String
  productImageUrlSnapshot: String?
  variantLabelSnapshot: String?
  mrpSnapshot: double?
  skuSnapshot: String?
  productSlugSnapshot: String?
  categoryNameSnapshot: String?
  productStatusSnapshot: String?
  appliedOfferSnapshot: String?
  quantity: int
  unitPrice: double
  totalPrice: double
  isFreeItem: bool, default=false
  isRewardProduct: bool, default=false
  quantityEditable: bool, default=true
  priceEditable: bool, default=true
  originalUnitPrice: double?
  rewardValue: double?
  rewardOfferId: String?
  rewardOfferName: String?
  rewardThreshold: double?
  rewardSource: String?
  isFreeDelivery: bool, default=false
  createdAt: DateTime, defaultModel=now, defaultPersist=now
indexes:
  order_item_order_idx:
    fields: orderId
  order_item_product_idx:
    fields: productId
  order_item_product_order_idx:
    fields: productId, orderId
