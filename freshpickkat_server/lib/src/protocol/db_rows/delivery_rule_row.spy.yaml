class: DeliveryRuleRow
serverOnly: true
table: delivery_rule
fields:
  id: UuidValue?, defaultPersist=random
  name: String
  description: String?
  deliveryFee: double
  sortOrder: int, default=0
  targetUserType: String?
  targetOrderCount: int?
  startsAt: DateTime?
  endsAt: DateTime?
  status: String, default='active'
  deactivatedAt: DateTime?
  createdAt: DateTime, defaultModel=now, defaultPersist=now
  updatedAt: DateTime, defaultModel=now, defaultPersist=now
