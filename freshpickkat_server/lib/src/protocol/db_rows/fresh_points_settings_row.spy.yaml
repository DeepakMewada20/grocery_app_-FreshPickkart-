class: FreshPointsSettingsRow
serverOnly: true
table: fresh_points_settings
fields:
  id: UuidValue?, defaultPersist=random
  isEnabled: bool, default=true
  redemptionPercentageLimit: double, default=0.50
  allowRedemptionOnCOD: bool, default=true
  minimumOrderForRedemption: double, default=0
  enablePointExpiry: bool, default=false
  pointExpiryDays: int, default=90
  enableAdminAdjustments: bool, default=true
  lastUpdatedBy: UuidValue?
  updatedAt: DateTime, defaultModel=now, defaultPersist=now
