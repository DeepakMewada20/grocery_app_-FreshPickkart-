class: AppUserRow
serverOnly: true
table: app_user
fields:
  id: UuidValue?, defaultPersist=random
  firebaseUid: String?
  phoneNumber: String
  name: String?
  email: String?
  role: String, default='customer'
  fcmToken: String?
  status: String, default='active'
  deactivatedAt: DateTime?
  currentFreshPoints: int, default=0
  totalEarned: int, default=0
  totalRedeemed: int, default=0
  referralCode: String?
  referralCodeApplied: String?
  referralSource: String?
  referralAppliedAt: DateTime?
  referralWindowExpiresAt: DateTime?
  referralOnboardingDismissedAt: DateTime?
  termsAcceptedAt: DateTime?
  codOrdersPlaced: int, default=0
  codOrdersDelivered: int, default=0
  codOrdersRejected: int, default=0
  isCodBlocked: bool, default=false
  codBlockedReason: String?
  codBlockedAt: DateTime?
  createdAt: DateTime, defaultModel=now, defaultPersist=now
  updatedAt: DateTime, defaultModel=now, defaultPersist=now
indexes:
  app_user_firebase_uid_idx:
    fields: firebaseUid
    unique: true
  app_user_referral_code_idx:
    fields: referralCode
    unique: true
