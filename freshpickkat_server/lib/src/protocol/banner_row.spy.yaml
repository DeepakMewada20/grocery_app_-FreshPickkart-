class: BannerRow
serverOnly: true
table: banner
fields:
  id: UuidValue?, defaultPersist=random
  title: String
  imageUrl: String
  actionType: String
  offerId: String?
  externalUrl: String?
  linkedProductId: UuidValue?
  comboOfferId: UuidValue?
  couponId: UuidValue?
  linkedCategoryId: UuidValue?
  linkedSubCategoryId: UuidValue?
  priority: int, default=0
  isBaseImage: bool, default=false
  startsAt: DateTime
  endsAt: DateTime
  status: String, default='active'
  deactivatedAt: DateTime?
  createdAt: DateTime, defaultModel=now, defaultPersist=now
  updatedAt: DateTime, defaultModel=now, defaultPersist=now
