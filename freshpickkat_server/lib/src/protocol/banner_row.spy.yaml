class: BannerRow
serverOnly: true
table: banner
fields:
  id: UuidValue?, defaultPersist=random
  title: String
  imageUrl: String
  actionType: String
  offerId: String?
  externalUrl: String?
  linkedProductId: UuidValue?, relation(parent=product, onDelete=Restrict)
  comboOfferId: UuidValue?, relation(parent=combo_offer, onDelete=Restrict)
  couponId: UuidValue?, relation(parent=coupon, onDelete=Restrict)
  linkedCategoryId: UuidValue?, relation(parent=category, onDelete=Restrict)
  linkedSubCategoryId: UuidValue?, relation(parent=sub_category, onDelete=Restrict)
  priority: int, default=0
  isBaseImage: bool, default=false
  startsAt: DateTime
  endsAt: DateTime
  status: String, default='active'
  deactivatedAt: DateTime?
  createdAt: DateTime, defaultModel=now, defaultPersist=now
  updatedAt: DateTime, defaultModel=now, defaultPersist=now
