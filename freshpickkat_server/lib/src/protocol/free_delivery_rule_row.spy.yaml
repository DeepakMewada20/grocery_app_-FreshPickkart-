class: FreeDeliveryRuleRow
serverOnly: true
table: free_delivery_rule
fields:
  id: UuidValue?, defaultPersist=random
  name: String
  description: String?
  ruleType: String
  minOrderAmount: double?
  minItemsCount: int?
  couponId: UuidValue?
  userId: UuidValue?
  waivedAmount: double, default=0
  startsAt: DateTime
  endsAt: DateTime
  status: String, default='active'
  deactivatedAt: DateTime?
  createdAt: DateTime, defaultModel=now, defaultPersist=now
  updatedAt: DateTime, defaultModel=now, defaultPersist=now
