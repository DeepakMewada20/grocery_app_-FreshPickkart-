class: ComplaintRow
serverOnly: true
table: complaint
fields:
  id: UuidValue?, defaultPersist=random
  userId: UuidValue, relation(parent=app_user, onDelete=Restrict)
  orderId: UuidValue, relation(parent=customer_order, onDelete=Restrict)
  orderItemId: UuidValue?, relation(parent=order_item, onDelete=Restrict)
  complaintType: String, default='product'
  title: String, default=''
  selectedProducts: List<ComplaintProductItem>
  issueType: String
  selectedField: String?
  extraData: Map<String, String>?
  userPhone: String, default=''
  description: String
  imageUrls: List<String>
  status: String, default='Pending'
  adminReply: String?
  adminNote: String?
  resolutionType: String?
  createdAt: DateTime, defaultModel=now, defaultPersist=now
  updatedAt: DateTime, defaultModel=now, defaultPersist=now
indexes:
  complaint_order_item_idx:
    fields: orderItemId
  complaint_order_type_idx:
    fields: orderId, complaintType, selectedField, status
  complaint_user_created_idx:
    fields: userId, createdAt, id
  complaint_status_created_idx:
    fields: status, createdAt, id
  complaint_order_idx:
    fields: orderId
