class: CouponProductScopeRow
serverOnly: true
table: coupon_product_scope
fields:
  id: UuidValue?, defaultPersist=random
  couponId: UuidValue, relation(parent=coupon, onDelete=Cascade)
  productId: UuidValue
  createdAt: DateTime, defaultModel=now, defaultPersist=now
indexes:
  coupon_product_scope_unique_idx:
    fields: couponId, productId
    unique: true
