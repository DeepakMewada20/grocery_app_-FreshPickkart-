class: NotificationCampaignRow
serverOnly: true
table: notification_campaign
fields:
  id: UuidValue?, defaultPersist=random
  title: String
  body: String
  type: String
  topic: String
  imageUrl: String?
  targetAudience: String
  status: String, default='queued'
  priority: String, default='normal'
  scheduledAt: DateTime?
  creatorAdminFirebaseUid: String?
  targetMetadataJson: String?
  recipientCount: int, default=0
  successCount: int, default=0
  failureCount: int, default=0
  lastError: String?
  sentAt: DateTime?
  entityType: String?
  entityId: String?
  dataJson: String?
  createdAt: DateTime, defaultModel=now, defaultPersist=now
indexes:
  notification_campaign_created_idx:
    fields: createdAt, id
  notification_campaign_topic_idx:
    fields: topic, createdAt
  notification_campaign_status_created_idx:
    fields: status, createdAt, id
  notification_campaign_scheduled_idx:
    fields: scheduledAt, status
