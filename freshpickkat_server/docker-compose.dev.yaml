services:
  # Development databases
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: freshpickkat
      POSTGRES_PASSWORD: ${SERVERPOD_PASSWORD_database}
    volumes:
      - freshpickkat_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    restart: always
    ports:
      - "8091:6379"
    command: redis-server --requirepass "${SERVERPOD_PASSWORD_redis}"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: freshpickkat_test
      POSTGRES_PASSWORD: ${SERVERPOD_PASSWORD_test_database}
    volumes:
      - freshpickkat_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "${SERVERPOD_PASSWORD_test_redis}"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  freshpickkat_data:
  freshpickkat_test_data:
