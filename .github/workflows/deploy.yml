name: Production Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 40s
          command_timeout: 20m
          fingerprint: ""
          debug: true
          script: |
            cd ~/projects/grocery_app_-FreshPickkart-/freshpickkat_server
            
            echo "--- 1. Switching and Pulling Master Branch on Server ---"
            # Pehle GitHub se saari branches ki information fetch karenge
            git fetch --all
            
            # Agar server abhi main par hai, toh use master par switch karenge aur fresh pull karenge
            git checkout master || git checkout -b master origin/master
            git reset --hard origin/master
            
            echo "--- 2. Verifying .env File ---"
            if [ ! -f .env ] && [ -f ../.env ]; then
              ln -s ../.env .env
            fi
            
            echo "--- 3. Building Docker Images ---"
            docker compose -f docker-compose.prod.yaml build
            
            echo "--- 4. Running Serverpod Migrations ---"
            docker compose -f docker-compose.prod.yaml run --rm \
              --entrypoint /app/server \
              -e SERVERPOD_RUN_MODE=production \
              server --apply-migrations
            
            echo "--- 5. Starting Containers ---"
            docker compose -f docker-compose.prod.yaml up -d --remove-orphans
            
            echo "--- 6. Status ---"
            docker ps | grep freshpickkat