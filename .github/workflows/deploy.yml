name: Production Deployment

on:
  push:
    branches:
      - master
    paths:
      - 'freshpickkat_server/**'
      - 'freshpickkat_flutter/**'
      - 'freshpickkat_admin/**'
      - 'docker/**'
      - 'nginx_freshpickkart.conf'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
          cache: true # Baar-baar download na karna pade isliye cache on kiya

      - name: Create .env for customer app
        run: echo "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" > freshpickkat_flutter/.env

      - name: Build customer web
        run: |
          cd freshpickkat_flutter
          flutter pub get
          flutter build web --release --dart-define=API_BASE_URL=https://freshpickkart.com/api/

      - name: Build admin web
        run: |
          cd freshpickkat_admin
          flutter pub get
          flutter build web --release --dart-define=ADMIN_API_BASE_URL=https://freshpickkart.com/api/

      # --- UPDATE: STEP 1 - PEHLE GIT REPO UPDATE (TAKI SCP OVERWRITE NA KARE) ---
      - name: Update Code Repository on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 30s
          script: |
            cd ~/projects/grocery_app_-FreshPickkart-/
            
            # Agar git repo initialized hai toh fetch aur reset karein
            if [ -d .git ]; then
              echo "--- Fetching All Branches & Resetting to Master ---"
              git fetch --all
              git checkout master || git checkout -b master origin/master
              git reset --hard origin/master
            fi

            # Target directories bana rahe hain taaki SCP fail na ho
            mkdir -p freshpickkat_flutter/build/web
            mkdir -p freshpickkat_admin/build/web

      # --- VERIFY BUILDS EXIST BEFORE SCP ---
      - name: Verify build outputs
        run: |
          ls -la freshpickkat_flutter/build/web/ || { echo "customer build/web missing"; exit 1; }
          ls -la freshpickkat_admin/build/web/ || { echo "admin build/web missing"; exit 1; }
          ls -la nginx_freshpickkart.conf || { echo "nginx config missing"; exit 1; }

      # --- STEP 2 - SCP BUILDS TO SERVER ---
      - name: Copy builds to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "freshpickkat_flutter/build/web,freshpickkat_admin/build/web,nginx_freshpickkart.conf"
          target: ~/projects/grocery_app_-FreshPickkart-/
          strip_components: 0

      # --- STEP 3 - DOCKER BUILD + NGINX RELOAD ---
      - name: Deploy to Remote Server via SSH (Docker & Nginx)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 40s
          command_timeout: 20m
          debug: true
          script: |
            cd ~/projects/grocery_app_-FreshPickkart-/freshpickkat_server

            echo "--- 1. Verifying .env File Connection ---"
            if [ ! -f .env ] && [ -f ../.env ]; then
              echo "Linking .env from parent directory..."
              ln -s ../.env .env
            fi

            echo "--- 2. Building Flutter Docker Images ---"
            docker compose -f docker-compose.prod.yaml build flutter_web flutter_admin

            echo "--- 3. Starting Flutter Containers ---"
            docker compose -f docker-compose.prod.yaml up -d flutter_web flutter_admin

            echo "--- 4. Building Serverpod Docker Images ---"
            docker compose -f docker-compose.prod.yaml build server postgres redis

            echo "--- 5. Running Serverpod Migrations (Maintenance Mode) ---"
            docker compose -f docker-compose.prod.yaml run --rm \
              --entrypoint /app/server \
              -e SERVERPOD_RUN_MODE=production \
              server --apply-migrations --role maintenance

            echo "--- 6. Starting All Containers ---"
            docker compose -f docker-compose.prod.yaml up -d --remove-orphans

            echo "--- 7. Updating Host Nginx Configuration ---"
            # Humne nginx file ko root pe copy kiya tha isliye ../nginx_freshpickkart.conf sahi hai
            sudo cp ../nginx_freshpickkart.conf /etc/nginx/sites-available/freshpickkat
            sudo nginx -t && sudo systemctl reload nginx

            echo "--- 8. Final Container Status Check ---"
            docker ps | grep freshpickkat