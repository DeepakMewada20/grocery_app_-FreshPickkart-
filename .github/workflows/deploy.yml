name: Production Deployment

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'freshpickkat_server/**'
      - 'freshpickkat_flutter/**'
      - 'freshpickkat_admin/**'
      - 'docker/**'
      - 'nginx_freshpickkart.conf'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'freshpickkat_server/**'
            flutter_customer:
              - 'freshpickkat_flutter/**'
            flutter_admin:
              - 'freshpickkat_admin/**'
            nginx:
              - 'nginx_freshpickkart.conf'
            docker:
              - 'docker/**'
              - 'freshpickkat_server/docker-compose.prod.yaml'
            deploy_yml:
              - '.github/workflows/deploy.yml'

      # --- Flutter Builds (conditional) ---
      - name: Setup Flutter
        if: steps.filter.outputs.flutter_customer == 'true' || steps.filter.outputs.flutter_admin == 'true' || steps.filter.outputs.deploy_yml == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
          cache: true

      - name: Create .env for customer app
        if: steps.filter.outputs.flutter_customer == 'true' || steps.filter.outputs.deploy_yml == 'true'
        run: echo "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" > freshpickkat_flutter/.env

      - name: Build customer web
        if: steps.filter.outputs.flutter_customer == 'true' || steps.filter.outputs.deploy_yml == 'true'
        run: |
          cd freshpickkat_flutter
          flutter pub get
          flutter build web --release --dart2js-optimization=O4 --tree-shake-icons --dart-define=API_BASE_URL=https://freshpickkart.com/api/

      - name: Build admin web
        if: steps.filter.outputs.flutter_admin == 'true' || steps.filter.outputs.deploy_yml == 'true'
        run: |
          cd freshpickkat_admin
          flutter pub get
          flutter build web --release --dart2js-optimization=O4 --tree-shake-icons --dart-define=ADMIN_API_BASE_URL=https://freshpickkart.com/api/

      # --- Git update on server (always) ---
      - name: Update Code Repository on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 30s
          envs: 'GITHUB_REF_NAME'
          script: |
            cd ~/projects/grocery_app_-FreshPickkart-/
            if [ -d .git ]; then
              echo "--- Fetching & Resetting to $GITHUB_REF_NAME ---"
              git fetch --all
              git checkout "$GITHUB_REF_NAME" || git checkout -b "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
              git reset --hard "origin/$GITHUB_REF_NAME"
            fi

      # --- SCP builds to server (conditional) ---
      - name: SCP customer web build
        if: steps.filter.outputs.flutter_customer == 'true' || steps.filter.outputs.deploy_yml == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "freshpickkat_flutter/build/web"
          target: ~/projects/grocery_app_-FreshPickkart-/
          strip_components: 0

      - name: SCP admin web build
        if: steps.filter.outputs.flutter_admin == 'true' || steps.filter.outputs.deploy_yml == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "freshpickkat_admin/build/web"
          target: ~/projects/grocery_app_-FreshPickkart-/
          strip_components: 0

      - name: SCP nginx config
        if: steps.filter.outputs.nginx == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "nginx_freshpickkart.conf"
          target: ~/projects/grocery_app_-FreshPickkart-/

      # --- SSH deploy (conditional docker commands) ---
      - name: Deploy via SSH (Docker & Nginx)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 40s
          command_timeout: 20m
          debug: true
          envs: 'FLUTTER_CUSTOMER,FLUTTER_ADMIN,SERVER,DOCKER,NGINX'
          script: |
            cd ~/projects/grocery_app_-FreshPickkart-/freshpickkat_server

            echo "--- Verifying .env File Connection ---"
            if [ ! -f .env ] && [ -f ../.env ]; then
              echo "Linking .env from parent directory..."
              ln -s ../.env .env
            fi

            echo "--- Building Flutter Customer Web (if changed) ---"
            if [ "$FLUTTER_CUSTOMER" = "true" ]; then
              docker compose -f docker-compose.prod.yaml build flutter_web
            fi

            echo "--- Building Flutter Admin Web (if changed) ---"
            if [ "$FLUTTER_ADMIN" = "true" ]; then
              docker compose -f docker-compose.prod.yaml build flutter_admin
            fi

            echo "--- Building Server + DB Images (if changed) ---"
            if [ "$SERVER" = "true" ] || [ "$DOCKER" = "true" ]; then
              docker compose -f docker-compose.prod.yaml build server postgres redis
              docker compose -f docker-compose.prod.yaml run --rm \
                --entrypoint /app/server \
                -e SERVERPOD_RUN_MODE=production \
                server --apply-migrations --role maintenance
            fi

            echo "--- Updating Nginx (if changed) ---"
            if [ "$NGINX" = "true" ]; then
              sudo cp ../nginx_freshpickkart.conf /etc/nginx/sites-available/freshpickkat
              sudo nginx -t && sudo systemctl reload nginx
            fi

            echo "--- Ensuring all containers are running ---"
            docker compose -f docker-compose.prod.yaml up -d --remove-orphans

            echo "--- Final Container Status Check ---"
            docker ps | grep freshpickkat
        env:
          FLUTTER_CUSTOMER: ${{ steps.filter.outputs.flutter_customer }}
          FLUTTER_ADMIN: ${{ steps.filter.outputs.flutter_admin }}
          SERVER: ${{ steps.filter.outputs.server }}
          DOCKER: ${{ steps.filter.outputs.docker }}
          NGINX: ${{ steps.filter.outputs.nginx }}