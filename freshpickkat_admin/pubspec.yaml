name: freshpickkat_admin
description: FreshPickKart Admin App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.8.0'
  flutter: '^3.32.0'

dependencies:
  cupertino_icons: ^1.0.5
  flutter:
    sdk: flutter
  freshpickkat_client:
    path: ../freshpickkat_client
  serverpod_flutter: ^3.4.10
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  cloud_firestore: ^6.1.2
  geolocator: ^13.0.2
  firebase_storage: ^13.0.2
  google_maps_flutter: ^2.12.1
  get: ^4.7.3
  get_storage: ^2.1.1
  google_fonts: ^6.3.3
  flutter_screenutil: ^5.9.3
  auto_size_text: ^3.0.0
  pinput: ^6.0.2
  image_picker: ^1.2.0
  image_cropper: ^11.0.0
  internet_connection_checker_plus: ^2.7.2
  url_launcher: ^6.3.0
  universal_io: ^2.2.2
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/delivery_scooter_traking.png
